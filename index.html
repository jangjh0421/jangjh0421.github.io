<!-- Fallback only: Space Grotesk stands in for Neue Machina until its files are added. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..400&display=swap" rel="stylesheet">
<style>
  /* PP Neue Machina: uses the copy installed on this computer if there is one,
     otherwise fonts/PPNeueMachina-PlainRegular.woff2 once it is added to the repo. */
  @font-face {
    font-family: "PP Neue Machina";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: local("PP Neue Machina Plain Regular"), local("PPNeueMachina-PlainRegular"),
         local("PP Neue Machina Regular"), local("PPNeueMachina-Regular"),
         local("Neue Machina Regular"), local("NeueMachina-Regular"),
         url("fonts/PPNeueMachina-PlainRegular.woff2") format("woff2");
  }

  :root {
    /* One design pixel. The Figma frame is 1512 × 982, so the name scales with the window width. */
    --s: min(1.6px, max(calc(100vw / 1512), min(0.62px, calc((100vw - 40px) / 527))));
    --ink: #000;
    --paper: #fff;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
  }

  /* 1–6 */
  .nav {
    position: absolute;
    left: calc(43 * var(--s));
    top: calc(29 * var(--s));
  }
  .index {
    margin: 0;
    padding: 0;
    list-style: none;
    font-family: "PP Neue Machina", "Space Grotesk", ui-sans-serif, sans-serif;
    font-weight: 400;
    font-size: calc(48 * var(--s));
    line-height: calc(45.8 * var(--s));
    font-variant-numeric: lining-nums;
  }
  .index a {
    display: inline-block;
    color: inherit;
    text-decoration: none;
  }
  .index a:hover,
  .elsewhere a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  .index a:focus-visible,
  .elsewhere a:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  .title {
    display: flex;
    gap: calc(38 * var(--s));
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: calc(27 * var(--s));
    line-height: calc(35.4 * var(--s));
    letter-spacing: -0.005em;
    white-space: nowrap;
  }
  .title span { display: block; text-align: right; }

  /* LinkedIn / GitHub / Instagram */
  .elsewhere {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(38 * var(--s));
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    justify-content: center;
    gap: max(18px, calc(27 * var(--s)));
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: max(15px, calc(19 * var(--s)));
    line-height: 1;
  }
  .elsewhere a { color: inherit; text-decoration: none; }
</style>
</head>
